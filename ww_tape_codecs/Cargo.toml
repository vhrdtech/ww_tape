[package]
name = "ww_tape_codecs"
version = "0.1.0"
authors.workspace = true
description = "Column codecs of ww_tape: bit packing, CRC-32C, varints, lz4, samples, times, payload lengths and summary kernels, with no notion of a block"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
# the column encoders that return a Vec (time columns)
alloc = []
# run-time CPU feature detection for the vector kernels, and the summary kernels
std = ["alloc"]

[dependencies]
crc.workspace = true
lz4_flex.workspace = true

# The workspace's [lints] plus exact_units' panic-class lints: no panic, overflow or unchecked index reachable from file bytes (STD-131).
# Every exception is an #[expect(.., reason = "..")] naming its invariant; tests may panic (lib.rs, tests/it).
[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
