[package]
name = "ww_tape"
version = "0.1.0"
authors.workspace = true
description = "Tape blocks: tracks of ShrinkWrap records in self-checking, variable-length blocks, for live feeds and log files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
# the positional reader (TapeReader over a ByteSource) and the piece chain check, without std (WASM)
alloc = ["ww_tape_codecs/alloc"]
# owned describe records, memory sinks and stores, the system clock, reading blocks from an io::Read (FileBlocks)
std = ["alloc", "blake3/std", "exact_units/std", "shrink_wrap/std", "ww_tape_codecs/std", "ww_version/std"]

[dependencies]
blake3.workspace = true
exact_units = { workspace = true, features = ["counting", "information", "shrink_wrap", "time"] }
lz4_flex.workspace = true
shrink_wrap.workspace = true
ww_tape_codecs.workspace = true
ww_version.workspace = true

[dev-dependencies]
exact_units = { workspace = true, features = ["counting", "electrical", "shrink_wrap", "std", "time"] }
# tests/evolution.rs: the source against api_snapshots/
wire_weaver_evolution.workspace = true

[lints]
workspace = true
