[package]
name = "example_ethernet"
version.workspace = true
authors.workspace = true
description = "The ww_tape book's protocol analyser: both directions of a 10 Gbps Ethernet link, captured into memory and triaged"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
# the headless pipeline; `--bin ethernet_sizes` prints what each track takes
default-run = "example_ethernet"

[dependencies]
exact_units = { workspace = true, features = ["counting", "information"] }
example_capture.workspace = true
shrink_wrap.workspace = true
ww_tape = { workspace = true, features = ["std"] }
ww_tape_mux.workspace = true

[lints]
workspace = true
