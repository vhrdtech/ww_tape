[package]
name = "ww_tape_summary"
version = "0.1.0"
publish = false
authors.workspace = true
description = "Summary trees of ww_tape tracks: event item trees and series statistics, built into summary blocks and read from them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
# series nodes with every channel (SeriesNode), without std
alloc = ["ww_tape/alloc"]
# the builders (EventTree, SeriesSummaries) and the run-time choice of the summary kernels
std = ["alloc", "exact_units/std", "ww_tape/std", "ww_tape_codecs/std"]

[dependencies]
exact_units = { workspace = true, features = ["shrink_wrap"] }
ww_tape.workspace = true
ww_tape_codecs.workspace = true

[dev-dependencies]
exact_units = { workspace = true, features = ["counting", "electrical", "shrink_wrap", "std", "time"] }
# tests: the definitions of a series track
shrink_wrap = { workspace = true, features = ["std"] }

# The workspace's [lints] plus the panic-class lints of ww_tape: no panic, overflow or unchecked index reachable from
# block bytes. Every exception is an #[expect(.., reason = "..")] naming its invariant; tests may panic (lib.rs).
[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
