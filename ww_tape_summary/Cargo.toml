[package]
name = "ww_tape_summary"
version.workspace = true
publish = false
authors.workspace = true
description = "Summary trees of ww_tape tracks: event item trees and series statistics, built into summary blocks and read from them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
# series nodes with every channel (SeriesNode), without std
alloc = ["ww_tape/alloc"]
# the builders (EventTree, SeriesSummaries) and the run-time choice of the summary kernels
std = ["alloc", "exact_units/std", "ww_tape/std", "ww_tape_codecs/std"]

[dependencies]
exact_units = { workspace = true, features = ["information", "shrink_wrap"] }
ww_tape.workspace = true
ww_tape_codecs.workspace = true

[dev-dependencies]
exact_units = { workspace = true, features = ["counting", "electrical", "shrink_wrap", "std", "time"] }
# tests: the definitions of a series track
shrink_wrap = { workspace = true, features = ["std"] }

[lints]
workspace = true
