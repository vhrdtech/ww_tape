[workspace]
resolver = "3"
members = ["ww_tape", "ww_tape_bench", "ww_tape_benchmarks", "ww_tape_codecs", "ww_tape_codecs_benchmarks", "ww_tape_example", "ww_tape_figures", "ww_tape_fs", "ww_tape_fuzz", "ww_tape_summary", "ww_tape_tests"]
# cargo-fuzz targets, a workspace of its own (nightly)
exclude = ["fuzz"]

[workspace.package]
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
# 1.89: the AVX-512 intrinsics of ww_tape_codecs::bitpack
rust-version = "1.89"
repository = "https://github.com/vhrdtech/ww_tape"
homepage = "https://tape.vhrd.tech/"
license = "MIT"

[workspace.dependencies]
ww_tape = { version = "0.1.0", path = "./ww_tape", default-features = false }
ww_tape_bench = { path = "./ww_tape_bench" }
ww_tape_codecs = { version = "0.1.0", path = "./ww_tape_codecs", default-features = false }
ww_tape_example = { path = "./ww_tape_example" }
ww_tape_fs = { version = "0.1.0", path = "./ww_tape_fs" }
ww_tape_summary = { version = "0.1.0", path = "./ww_tape_summary", default-features = false }

# git dependencies without rev or tag: Cargo.lock pins the commit, `cargo update -p NAME` moves it
exact_units = { version = "0.1.0", git = "https://github.com/romixlab/exact_units", default-features = false }
# ww_tape_codecs_benchmarks: the motor simulation data set
motor_sim = { git = "https://github.com/vhrdtech/motor_sim", default-features = false }
shrink_wrap = { version = "0.2.0", git = "https://github.com/romixlab/shrink_wrap", default-features = false }
# the bench binaries' --version, --color and shell completion
vc_build = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_complete = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_ui = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
# ww_tape's tests/evolution.rs: the API snapshot check `ww api check` runs, as a test
wire_weaver_evolution = { version = "0.5.0", git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["source"] }
ww_version = { version = "0.2.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }

anyhow = { version = "1", default-features = false, features = ["std"] }
# pure: no C or assembly build step; std (through ww_tape std) turns on run-time SIMD detection
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
clap = { version = "4.5", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions"] }
crc = { version = "3.4", default-features = false }
# ww_tape_codecs_benchmarks: a pure-Rust Vorbis decoder for the speech data set
lewton = { version = "0.10", default-features = false, features = ["ogg"] }
# ww_tape_fs on unix: pthread_atfork, so a forked child holds no file sink's lock
libc = { version = "0.2", default-features = false }
libm = { version = "0.2", default-features = false, features = ["arch"] }
# exact: ww_tape lz4 payload columns must compress to the same bytes (ww_tape_codecs/src/lz4.rs)
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "checked-decode"] }
# ww_tape_fs on unix: a file sink's flock and the file system type of its file (fstatfs)
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
# the bench reports, and the book's figures that read them
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# exact_units' panic-class lints for every crate: no panic, overflow or unchecked index reachable from file bytes
# (READ-2). Every exception is an #[expect(.., reason = "..")] naming its invariant. Tests, benches, the figures and
# the fuzz bodies allow the lints that fire in them at their crate root, with the reason.
[workspace.lints.rust]
unused_lifetimes = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "warn"                # #[expect] fails once the lint stops firing, so an exception cannot outlive its cause
as_ptr_cast_mut = "warn"                 # `as_ptr() as *mut` writes through a shared borrow: undefined behaviour
cognitive_complexity = "warn"            # agents grow functions branch by branch; a tangled one is split
debug_assert_with_mut_call = "warn"      # a debug_assert! that calls a &mut method makes debug and release builds behave differently
exit = "warn"                            # process::exit skips every destructor; main returns instead
fallible_impl_from = "warn"              # a From that can panic is a TryFrom
get_unwrap = "warn"                      # `.get(i).unwrap()` is indexing with a worse message: index, or handle the None
ignore_without_reason = "warn"           # an ignored test says why, or nobody knows when it may run again
let_underscore_must_use = "warn"         # `let _ =` on a must_use value drops an error unseen
map_err_ignore = "warn"                  # `map_err(|_| ...)` throws the cause away; wrap it as the source
mem_forget = "warn"                      # forget leaks the value and skips Drop; ManuallyDrop says it on purpose
self_named_module_files = "warn"         # one module layout, mod.rs, across the workspace
str_to_string = "warn"                   # to_owned says what happens: a copy of a borrowed str
too_long_first_doc_paragraph = "warn"    # agents write long doc summaries; the first paragraph is one short sentence
unnecessary_safety_doc = "warn"          # a # Safety section on a safe function sends readers looking for a contract that is not there
use_self = "warn"                        # Self follows a rename

[profile.dev]
debug = false
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
split-debuginfo = "unpacked"

# ww_tape_fuzz decodes a million hostile blocks per decoder in a test: optimized, overflow checks still on
[profile.test.package.ww_tape]
opt-level = 3

[profile.test.package.ww_tape_codecs]
opt-level = 3

# the example records the drive's hour at full scale, several times in its tests
[profile.test.package.ww_tape_example]
opt-level = 3

[profile.test.package.ww_tape_fuzz]
opt-level = 3

[profile.test.package.ww_tape_summary]
opt-level = 3

# the integration tests resume at every cut and read long chains
[profile.test.package.ww_tape_tests]
opt-level = 3

[profile.deploy]
inherits = "release"
incremental = true
