[workspace]
resolver = "3"
members = ["examples/example_capture", "examples/example_drive", "examples/example_ethernet", "examples/example_images", "examples/example_rf", "examples/example_settings", "examples/example_thermal", "examples/example_wideband", "ww_tape", "ww_tape_bench", "ww_tape_bench_report", "ww_tape_benchmarks", "ww_tape_book_outputs", "ww_tape_codecs", "ww_tape_codecs_benchmarks", "ww_tape_figures", "ww_tape_fs", "ww_tape_fuzz", "ww_tape_mux", "ww_tape_summary", "ww_tape_testalloc", "ww_tape_tests"]
# cargo-fuzz targets, a workspace of its own (nightly)
exclude = ["fuzz"]

[workspace.package]
version = "0.15.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
# 1.99: the git dependencies of the WireWeaver family declare it; 1.89 alone would do for the AVX-512 intrinsics of
# ww_tape_codecs::bitpack
rust-version = "1.99"
repository = "https://github.com/vhrdtech/ww_tape"
homepage = "https://tape.vhrd.tech/"
license = "MIT"

[workspace.dependencies]
example_capture = { path = "./examples/example_capture" }
example_drive = { path = "./examples/example_drive" }
example_ethernet = { path = "./examples/example_ethernet" }
example_images = { path = "./examples/example_images" }
example_rf = { path = "./examples/example_rf" }
example_thermal = { path = "./examples/example_thermal" }
example_wideband = { path = "./examples/example_wideband" }
ww_tape = { version = "0.15.0", path = "./ww_tape", default-features = false }
ww_tape_bench = { path = "./ww_tape_bench" }
ww_tape_bench_report = { path = "./ww_tape_bench_report" }
ww_tape_book_outputs = { path = "./ww_tape_book_outputs" }
ww_tape_codecs = { version = "0.15.0", path = "./ww_tape_codecs", default-features = false }
ww_tape_fs = { version = "0.15.0", path = "./ww_tape_fs" }
ww_tape_mux = { path = "./ww_tape_mux" }
ww_tape_summary = { version = "0.15.0", path = "./ww_tape_summary", default-features = false }
ww_tape_testalloc = { path = "./ww_tape_testalloc" }

# git dependencies without rev or tag: Cargo.lock pins the commit, `cargo update -p NAME` moves it
exact_units = { version = "0.1.0", git = "https://github.com/romixlab/exact_units", default-features = false }
# ww_tape_codecs_benchmarks: the motor simulation data set
motor_sim = { git = "https://github.com/vhrdtech/motor_sim", default-features = false }
shrink_wrap = { version = "0.2.0", git = "https://github.com/romixlab/shrink_wrap", default-features = false }
# the bench binaries' --version, --color and shell completion
vc_build = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_complete = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_ui = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
# ww_tape's tests/evolution.rs: the API snapshot check `ww api check` runs, as a test
wire_weaver_evolution = { version = "0.5.0", git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["source"] }
ww_version = { version = "0.2.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }

anyhow = { version = "1", default-features = false, features = ["std"] }
# pure: no C or assembly build step; std (through ww_tape std) turns on run-time SIMD detection
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
clap = { version = "4.5", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions"] }
crc = { version = "3.4", default-features = false }
# ww_tape_codecs_benchmarks: a pure-Rust Vorbis decoder for the speech data set
lewton = { version = "0.10", default-features = false, features = ["ogg"] }
# ww_tape_fs on unix: pthread_atfork, so a forked child holds no file sink's lock
libc = { version = "0.2", default-features = false }
libm = { version = "0.2", default-features = false, features = ["arch"] }
# exact: ww_tape lz4 payload columns must compress to the same bytes (ww_tape_codecs/src/lz4.rs)
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "checked-decode"] }
# example_ethernet's triage: the chunks of a piece decoded in parallel; never a dependency of a ww_tape library
rayon = { version = "1.10", default-features = false }
# ww_tape_fs on unix: a file sink's flock and the file system type of its file (fstatfs)
rustix = { version = "1.1", default-features = false, features = ["event", "fs", "pipe", "std"] }
# the bench reports, and the book's figures that read them
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# ww_tape_tests: the mux's and the followers' futures run on smol, no runtime in any crate's dependencies
smol = { version = "2", default-features = false }
# ww_tape_tests and example_drive's tests: the mux's and the followers' futures run on tokio's schedulers, without
# its I/O or time drivers
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }

# exact_units' panic-class lints for every crate: no panic, overflow or unchecked index reachable from file bytes
# (READ-2). Every exception is an #[expect(.., reason = "..")] naming its invariant. Tests, benches, the figures and
# the fuzz bodies allow the lints that fire in them at their crate root, with the reason.
[workspace.lints.rust]
# Unsafe code only in the crates spirit_level.toml's map marks unsafe; each sets unsafe_code = "deny" in its own [lints]
unsafe_code = "forbid"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }    # manifest hygiene: feature names, wildcard versions
pedantic = { level = "warn", priority = -1 } # the stricter idioms; the opt-outs below are the ones that are noise for most code
doc_markdown = "allow"                       # the docs link items as bare [Item], about 2,900 sites: backticks come in a pass of their own, apart from code changes
missing_panics_doc = "warn"                  # a public function that can panic says when in a # Panics section; the docs keep up with the asserts
assigning_clones = "allow"                   # clone_into reads backwards
cargo_common_metadata = "allow"              # keywords and categories matter only for published crates; package-description covers the rest
default_trait_access = "allow"               # Default::default() is clear where the type is written beside it
float_cmp = "allow"                          # exact float comparisons are usually intended; float_cmp_const stays on
implicit_hasher = "allow"                    # a BuildHasher type parameter on public functions is not worth it
inline_always = "allow"                      # #[inline(always)] is written where it was measured
items_after_statements = "allow"             # a helper item next to its only use reads better
many_single_char_names = "allow"             # r, g, b and x, y, z are fine
map_unwrap_or = "allow"                      # `.map(f).unwrap_or(x)` often reads better than map_or
missing_errors_doc = "allow"                 # the error type documents its cases
multiple_crate_versions = "allow"            # spl's duplicate-versions checks this, with deny.toml's skip list
must_use_candidate = "allow"                 # thousands of hits; must_use goes where ignoring the value is a bug
needless_raw_string_hashes = "allow"         # r#"..."# keeps a string editable when a quote is added
redundant_closure_for_method_calls = "allow" # a closure is often clearer than a path to a method
return_self_not_must_use = "allow"           # thousands of hits on builders
similar_names = "allow"                      # too many false positives: encoder and encoded are different things
struct_excessive_bools = "allow"             # a struct of flags is often just that
struct_field_names = "allow"                 # a field named after its struct is often the clearest name
too_many_lines = "allow"                     # spl's function-lines measures function length, with a limit per crate and expiring exceptions
trivially_copy_pass_by_ref = "allow"         # passing small Copy types by reference is harmless
unnecessary_debug_formatting = "allow"       # paths printed with {:?} quote themselves, which helps with spaces
unreadable_literal = "allow"                 # addresses and magic numbers are written as their sources write them
used_underscore_binding = "allow"            # an underscore binding used in one cfg is common
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "warn"                    # #[expect] fails once the lint stops firing, so an exception cannot outlive its cause
as_ptr_cast_mut = "warn"                     # `as_ptr() as *mut` writes through a shared borrow: undefined behaviour
cognitive_complexity = "warn"                # agents grow functions branch by branch; a tangled one is split
debug_assert_with_mut_call = "warn"          # a debug_assert! that calls a &mut method makes debug and release builds behave differently
exit = "warn"                                # process::exit skips every destructor; main returns instead
fallible_impl_from = "warn"                  # a From that can panic is a TryFrom
get_unwrap = "warn"                          # `.get(i).unwrap()` is indexing with a worse message: index, or handle the None
ignore_without_reason = "warn"               # an ignored test says why, or nobody knows when it may run again
let_underscore_must_use = "warn"             # `let _ =` on a must_use value drops an error unseen
map_err_ignore = "warn"                      # `map_err(|_| ...)` throws the cause away; wrap it as the source
mem_forget = "warn"                          # forget leaks the value and skips Drop; ManuallyDrop says it on purpose
self_named_module_files = "warn"             # one module layout, mod.rs, across the workspace
str_to_string = "warn"                       # to_owned says what happens: a copy of a borrowed str
too_long_first_doc_paragraph = "warn"        # agents write long doc summaries; the first paragraph is one short sentence
unnecessary_safety_doc = "warn"              # a # Safety section on a safe function sends readers looking for a contract that is not there
use_self = "warn"                            # Self follows a rename
float_cmp_const = "deny"                     # comparing a float to a constant exactly is almost always a bug
imprecise_flops = "deny"                     # hypot, ln_1p and friends are more precise than the formula written out
iter_over_hash_type = "deny"                 # iteration over a hash map changes order from run to run, and the bytes with it
lossy_float_literal = "deny"                 # a float literal that does not fit its type silently becomes another number

[profile.dev]
debug = false
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
split-debuginfo = "unpacked"

# ww_tape_fuzz decodes a million hostile blocks per decoder in a test: optimized, overflow checks still on
[profile.test.package.ww_tape]
opt-level = 3

[profile.test.package.ww_tape_codecs]
opt-level = 3

# the examples record the drive's hour at full scale and the cases at line rate, several times in their tests
[profile.test.package.example_capture]
opt-level = 3

[profile.test.package.example_drive]
opt-level = 3

[profile.test.package.example_ethernet]
opt-level = 3

[profile.test.package.example_images]
opt-level = 3

[profile.test.package.example_rf]
opt-level = 3

[profile.test.package.example_thermal]
opt-level = 3

[profile.test.package.example_wideband]
opt-level = 3

[profile.test.package.ww_tape_fuzz]
opt-level = 3

# a heap test writes and reads a 2 GiB value of a bytes track through a file
[profile.test.package.ww_tape_fs]
opt-level = 3

# the mux tests send millions of items through the handles and resume at every block boundary
[profile.test.package.ww_tape_mux]
opt-level = 3

[profile.test.package.ww_tape_summary]
opt-level = 3

# the integration tests resume at every cut and read long chains
[profile.test.package.ww_tape_tests]
opt-level = 3

[profile.deploy]
inherits = "release"
incremental = true
