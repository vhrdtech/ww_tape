[package]
name = "ww_tape_example"
version.workspace = true
authors.workspace = true
description = "The drive motor controller's recording that the book's figures, code and numbers use, at any scale"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
# the story's numbers; `--bin first_tape` runs the program of the chapter "A first tape"
default-run = "ww_tape_example"

[dependencies]
exact_units = { workspace = true, features = ["counting", "information"] }
libm.workspace = true
shrink_wrap.workspace = true
ww_tape = { workspace = true, features = ["std"] }
ww_tape_fs.workspace = true
ww_tape_mux.workspace = true
ww_tape_summary = { workspace = true, features = ["std"] }

[dev-dependencies]
# tests/producers.rs: the async twin of producers::threads, on tokio tasks; ww_tape_mux itself keeps no runtime dependency
tokio.workspace = true

[lints]
workspace = true
