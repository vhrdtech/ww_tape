# spirit_level configuration: https://github.com/romixlab/spirit_level (book: configuration)
extends = ["small-workspace", "ai"]

# Override a lint: a level and/or parameters, always with a reason, optionally an expiry.
# [lints.crate-lines]
# level = "deny"
# reason = "why"
# expires = "2027-06-30"

[docs]
# The format reference is looked up block by block, not read front to back, so the reading-time budget of a guide
# does not apply. It stays one page because other books link to its anchors (#tape-blocks, #track-identity and more),
# and its layouts are checked against the module docs as one page (ww_tape_tests/tests/it/book.rs).
reference = ["docs/format.md"]

# The book and the READMEs are read by newcomers: every prose lint denies, so a long page or sentence cannot land.
[lints.prose-run-words]
level = "deny"
reason = "a wall of prose loses the reader; a heading, table or figure every 400 words gives a place to rest"

[lints.page-reading-time]
level = "deny"
reason = "a guide page is read in one sitting; a longer one is split where its purpose changes"

[lints.heading-words]
level = "deny"
reason = "a heading is a short name the reader scans for"

[lints.code-wall]
level = "deny"
reason = "code on a page comes with the prose that explains it"

[lints.code-block-language]
level = "deny"
reason = "every block names its language, so it is highlighted and checked as what it is"

[lints.passive-voice]
level = "deny"
reason = "the pages say who does what: the writer, the reader or the application"

[lints.reading-ease]
level = "deny"
reason = "the book is read by newcomers to the format: short sentences of short words"

[lints.orphan-pages]
level = "deny"
reason = "every page of the book is reached from the navigation"

[lints.page-title]
level = "deny"
reason = "every page has one title"

[lints.abbreviation-first-use]
level = "deny"
reason = "common abbreviations and names stand plain; any other shows its long form on hover, never spelled out in prose"
# Abbreviations every reader knows, and names written in capitals (companies, products, standards bodies)
known = ["AI", "AMD", "API", "ASCII", "AVX", "AVX2", "BLAKE3", "CI", "CLI", "CPU", "CSS", "CSV", "DNS", "EPYC", "FAQ", "GPU", "HTML", "HTTP", "HTTPS", "IBM", "ID", "IDE", "IP", "JEDEC", "JSON", "KB", "MB", "GB", "TB", "LED", "LZ4", "MIT", "NEON", "OK", "OS", "PC", "PCB", "PDF", "PNG", "POSIX", "PR", "RAM", "README", "SDK", "SIGMOD", "SNIA", "SQL", "SSH", "SVG", "TCP", "TLS", "TOML", "UDP", "UI", "URL", "USB", "UTC", "UTF", "VESC", "XFS", "XML", "XOR", "YAML"]

# The rest: the book shows each long form on hover (spl_book_ext.abbreviations); prose writes the abbreviation alone
[lints.abbreviation-first-use.long-forms]
ADC = "analog-to-digital converter"
ALP = "Adaptive Lossless floating-Point compression"
CAN = "Controller Area Network"
CRC = "cyclic redundancy check"
eMMC = "embedded MultiMediaCard"
FIFO = "first in, first out"
FUSE = "Filesystem in Userspace"
GS = "gigasamples"
IMIX = "Internet Mix"
IQ = "in-phase and quadrature"
LTFS = "Linear Tape File System"
LTO = "Linear Tape-Open"
MCU = "microcontroller unit"
MLC = "multi-level cell"
NAND = "NOT-AND flash memory"
NFS = "Network File System"
NIC = "network interface card"
ONFI = "Open NAND Flash Interface"
ppm = "parts per million"
PCM = "pulse-code modulation"
RF = "radio frequency"
SD = "Secure Digital"
SLDC = "Streaming Lossless Data Compression"
SMB = "Server Message Block"
UBI = "Unsorted Block Images"
UBIFS = "UBI File System"
WASM = "WebAssembly"

[lints.term-before-definition]
level = "deny"
reason = "a page defines a term before it uses it, or links where it is defined"

[lints.paragraph-sentences]
level = "deny"
reason = "short paragraphs are read once and understood"

[lints.sentence-words]
level = "deny"
reason = "short sentences are read once and understood"

[lints.emoji]
level = "deny"
reason = "the pages carry words, not pictures of feelings; the tracker's status marks are the lint's allowed set"

[lints.page-links]
level = "deny"
reason = "a link between pages leads somewhere"

[lints.nav-entries]
level = "deny"
reason = "the navigation names pages that exist"

[lints.glossary-terms]
ignore = ["CAN"]
reason = "the glossary's CAN, the vehicle bus, matches the everyday word \"can\" on every page"

[[exceptions]]
lint = "glossary-terms"
paths = ["docs/format.md"]
level = "allow"
reason = "the format reference is looked up block by block and defines the terms itself; a mark in every section would underline every line"

[lints.publish-false]
level = "deny"
published = ["ww_tape", "ww_tape_codecs"]
reason = "ww_tape and ww_tape_codecs are published; every other crate is a build unit and says publish = false"

[lints.no-sys-crates]
allow = ["cc"]
reason = "cc is a build-dependency of blake3, built pure: its build script compiles no C (AGENTS.md, Dependencies)"

[lints.commit-subject-length]
after = "17ad6a7185a627efb58e066af34e83de9f078d97"
reason = "history up to main's tip of 21 Nov 2026 is pushed and cannot be rewritten"

[lints.commit-body-lines]
level = "deny"
