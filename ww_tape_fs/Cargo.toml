[package]
name = "ww_tape_fs"
version = "0.1.0"
publish = false
authors.workspace = true
description = "Files of ww_tape: a file sink and store of piece files, their lock, and writers and chains opened by path"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dependencies]
blake3 = { workspace = true, features = ["std"] }
ww_tape = { workspace = true, features = ["std"] }

# The workspace's [lints] plus the panic-class lints of ww_tape: no panic, overflow or unchecked index reachable from
# file bytes or a path. Every exception is an #[expect(.., reason = "..")] naming its invariant; tests may panic.
[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
