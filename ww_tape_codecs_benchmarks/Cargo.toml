[package]
name = "ww_tape_codecs_benchmarks"
version = "0.1.0"
authors.workspace = true
description = "Benchmarks of ww_tape_codecs: the float sample codec and bench-only ones on simulated, decoded and sensor data"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# the float sample codecs bench: `just bench-sample-codecs`
[[bin]]
name = "sample_codecs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
lewton.workspace = true
libm.workspace = true
motor_sim.workspace = true
vc_build.workspace = true
vc_ui.workspace = true
ww_tape_bench.workspace = true
ww_tape_codecs = { workspace = true, features = ["std"] }

[build-dependencies]
vc_build.workspace = true

[lints]
workspace = true
