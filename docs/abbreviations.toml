# The book's abbreviations, one long form per key, read by vhrd_zensical.abbreviations (docs/writers.md,
# "Abbreviations"). An abbreviation every reader knows, or a name in capitals, goes into spirit_level.toml's
# abbreviation-first-use.known instead and stays plain.
