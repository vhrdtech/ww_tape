<line x1="633.7" y1="74.0" x2="633.7" y2="66.0" class="thin"/>
<text x="633.7" y="63.0" text-anchor="middle" class="soft small">padding, 903 bytes</text>
<line x1="660.0" y1="74.0" x2="660.0" y2="66.0" class="thin"/>
<text x="660.0" y="63.0" text-anchor="end" class="soft small">tail</text>
<text x="664.0" y="122.0" text-anchor="end" class="soft small">ends on 60.0 KiB (15 × 4 KiB)</text>
<text x="24.0" y="262.0" text-anchor="start" class="small">piece 1, its first 1.7 KiB</text>
