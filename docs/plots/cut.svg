<svg class="ww-svg" viewBox="0 0 688 330" width="688" height="330" role="img" aria-label="A cut: piece 0 ends with its final index, its close padded by 2598 bytes to the 4 KiB end, and its tail; piece 1 starts with its head and 2 blocks of puts that carry the definitions, before its first data" xmlns="http://www.w3.org/2000/svg">
<text x="24.0" y="20.0" text-anchor="start" class="strong">a cut: the end of piece 0 and the start of piece 1</text>
<text x="24.0" y="46.0" text-anchor="start" class="small">piece 0, its last 12.2 KiB</text>
<rect x="24.5" y="76.0" width="51.4" height="30.0" rx="1" class="tint-blue"/>
<text x="50.2" y="95.5" text-anchor="middle" class="small">samples</text>
<rect x="76.9" y="76.0" width="400.3" height="30.0" rx="1" class="tint-green"/>
<text x="277.1" y="95.5" text-anchor="middle" class="small">final index</text>
<rect x="478.3" y="76.0" width="176.8" height="30.0" rx="1" class="tint-green"/>
<text x="566.7" y="95.5" text-anchor="middle" class="small">close</text>
<rect x="656.1" y="76.0" width="7.4" height="30.0" rx="1" class="tint-green"/>
<rect x="522.6" y="76.0" width="133.0" height="30.0" rx="0" class="faint hatch"/>
<line x1="500.2" y1="74.0" x2="500.2" y2="66.0" class="thin"/>
<text x="500.2" y="63.0" text-anchor="middle" class="soft small">close</text>
<line x1="589.1" y1="74.0" x2="589.1" y2="66.0" class="thin"/>
<text x="589.1" y="63.0" text-anchor="middle" class="soft small">padding, 2598 bytes</text>
<line x1="659.8" y1="74.0" x2="659.8" y2="66.0" class="thin"/>
<text x="659.8" y="63.0" text-anchor="end" class="soft small">tail</text>
<text x="664.0" y="122.0" text-anchor="end" class="soft small">ends on 56.0 KiB (14 × 4 KiB)</text>
<text x="24.0" y="262.0" text-anchor="start" class="small">piece 1, its first 1.7 KiB</text>
<rect x="24.5" y="216.0" width="228.6" height="30.0" rx="1" class="tint-green"/>
<text x="138.8" y="235.5" text-anchor="middle" class="small">head</text>
<rect x="254.1" y="216.0" width="27.9" height="30.0" rx="1" class="tint-purple"/>
<rect x="283.0" y="216.0" width="196.1" height="30.0" rx="1" class="tint-purple"/>
<text x="381.0" y="235.5" text-anchor="middle" class="small">puts</text>
<rect x="480.0" y="216.0" width="183.5" height="30.0" rx="1" class="tint-blue"/>
<text x="571.8" y="235.5" text-anchor="middle" class="small">frames</text>
<line x1="251.8" y1="214.0" x2="251.8" y2="206.0" class="thin"/>
<text x="251.8" y="203.0" text-anchor="middle" class="soft small">head and 2 blocks of puts</text>
<path d="M45.7 214.0 C45.7 166.0 500.2 166.0 500.2 108.0" class="accent-line"/>
<text x="24.0" y="122.0" text-anchor="start" class="accent small">piece 1's head names piece 0 by its content hash; its close names piece 1's id</text>
<rect x="24.0" y="280.0" width="16.0" height="12.0" rx="2" class="tint-green"/>
<text x="46.0" y="290.5" text-anchor="start" class="small">head, final index, close, tail</text>
