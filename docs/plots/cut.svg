<text x="24.0" y="46.0" text-anchor="start" class="small">piece 0, its last 12.7 KiB</text>
<rect x="24.5" y="76.0" width="34.7" height="30.0" rx="1" class="tint-teal"/>
<rect x="60.2" y="76.0" width="7.2" height="30.0" rx="1" class="tint-teal"/>
<rect x="68.4" y="76.0" width="5.6" height="30.0" rx="1" class="tint-teal"/>
<rect x="75.0" y="76.0" width="492.7" height="30.0" rx="1" class="tint-green"/>
