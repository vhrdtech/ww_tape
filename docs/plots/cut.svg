<svg class="ww-svg" viewBox="0 0 688 330" width="688" height="330" role="img" aria-label="A cut: piece 0 ends with its final index, its close padded by 3868 bytes to the 4 KiB end, and its tail; piece 1 starts with its head and 2 blocks of puts that carry the definitions, before its first data" xmlns="http://www.w3.org/2000/svg">
