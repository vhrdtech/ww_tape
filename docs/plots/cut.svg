<rect x="282.8" y="216.0" width="196.3" height="30.0" rx="1" class="tint-purple"/>
<text x="381.0" y="235.5" text-anchor="middle" class="small">puts</text>
<rect x="480.1" y="216.0" width="183.4" height="30.0" rx="1" class="tint-blue"/>
<text x="571.8" y="235.5" text-anchor="middle" class="small">frames</text>
<line x1="251.6" y1="214.0" x2="251.6" y2="206.0" class="thin"/>
<text x="251.6" y="203.0" text-anchor="middle" class="soft small">head and 2 blocks of puts</text>
<path d="M45.6 214.0 C45.6 166.0 589.8 166.0 589.8 108.0" class="accent-line"/>
