<svg class="ww-svg" viewBox="0 0 688 330" width="688" height="330" role="img" aria-label="A cut: piece 0 ends with its final index, its close padded by 3774 bytes to the 4 KiB end, and its tail; piece 1 starts with its head and 2 blocks of puts that carry the definitions, before its first data" xmlns="http://www.w3.org/2000/svg">
<text x="24.0" y="20.0" text-anchor="start" class="strong">a cut: the end of piece 0 and the start of piece 1</text>
<text x="24.0" y="46.0" text-anchor="start" class="small">piece 0, its last 12.8 KiB</text>
<rect x="24.5" y="76.0" width="49.2" height="30.0" rx="1" class="tint-blue"/>
<rect x="74.7" y="76.0" width="359.6" height="30.0" rx="1" class="tint-green"/>
<text x="254.5" y="95.5" text-anchor="middle" class="small">final index</text>
<rect x="435.3" y="76.0" width="220.2" height="30.0" rx="1" class="tint-green"/>
<text x="545.4" y="95.5" text-anchor="middle" class="small">close</text>
<rect x="656.5" y="76.0" width="7.0" height="30.0" rx="1" class="tint-green"/>
<rect x="471.0" y="76.0" width="184.9" height="30.0" rx="0" class="faint hatch"/>
<line x1="452.9" y1="74.0" x2="452.9" y2="66.0" class="thin"/>
<text x="452.9" y="63.0" text-anchor="middle" class="soft small">close</text>
<line x1="563.5" y1="74.0" x2="563.5" y2="66.0" class="thin"/>
<text x="563.5" y="63.0" text-anchor="middle" class="soft small">padding, 3774 bytes</text>
<line x1="660.0" y1="74.0" x2="660.0" y2="66.0" class="thin"/>
<text x="660.0" y="63.0" text-anchor="end" class="soft small">tail</text>
<text x="664.0" y="122.0" text-anchor="end" class="soft small">ends on 56.0 KiB (14 × 4 KiB)</text>
<text x="24.0" y="262.0" text-anchor="start" class="small">piece 1, its first 1.5 KiB</text>
<rect x="24.5" y="216.0" width="218.6" height="30.0" rx="1" class="tint-green"/>
<text x="133.8" y="235.5" text-anchor="middle" class="small">head</text>
<rect x="244.1" y="216.0" width="31.5" height="30.0" rx="1" class="tint-purple"/>
<rect x="276.6" y="216.0" width="179.1" height="30.0" rx="1" class="tint-purple"/>
<text x="366.2" y="235.5" text-anchor="middle" class="small">puts</text>
<rect x="456.7" y="216.0" width="206.8" height="30.0" rx="1" class="tint-blue"/>
<text x="560.1" y="235.5" text-anchor="middle" class="small">frames</text>
<line x1="239.9" y1="214.0" x2="239.9" y2="206.0" class="thin"/>
<text x="239.9" y="203.0" text-anchor="middle" class="soft small">head and 2 blocks of puts</text>
<path d="M48.4 214.0 C48.4 166.0 452.9 166.0 452.9 108.0" class="accent-line"/>
<text x="24.0" y="122.0" text-anchor="start" class="accent small">piece 1's head names piece 0 by its content hash; its close names piece 1's id</text>
<rect x="24.0" y="280.0" width="16.0" height="12.0" rx="2" class="tint-green"/>
<text x="46.0" y="290.5" text-anchor="start" class="small">head, final index, close, tail</text>
<rect x="252.0" y="280.0" width="16.0" height="12.0" rx="2" class="tint-purple"/>
<text x="274.0" y="290.5" text-anchor="start" class="small">puts</text>
<rect x="308.4" y="280.0" width="16.0" height="12.0" rx="2" class="tint-blue"/>
<text x="330.4" y="290.5" text-anchor="start" class="small">data</text>
<rect x="364.8" y="280.0" width="16.0" height="12.0" rx="2" class="faint hatch"/>
<text x="386.8" y="290.5" text-anchor="start" class="small">padding</text>
<text x="24.0" y="314.0" text-anchor="start" class="soft small">drawn from the drive's chain at 1/1000 of its data; each row at its own scale</text>
</svg>
