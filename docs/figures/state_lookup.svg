<svg class="ww-svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-label="A state lookup walks back from its place through the index entries of one slot: the newest record's block is damaged and listed as lost, a stretch the index does not cover is listed as uncovered, and the next older record that reads is the answer" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" text-anchor="start" class="strong">the bytes of a piece, and the records of one slot in them</text>
  <text x="660" y="22" text-anchor="end" class="soft small">bytes of the piece →</text>
  <rect x="20.5" y="58" width="639" height="30" rx="2" class="tint-blue"/>
  <rect x="20.5" y="58" width="10" height="30" class="tint-ink"/>
  <rect x="96" y="58" width="8" height="30" class="tint-purple"/>
  <rect x="206" y="58" width="8" height="30" class="tint-purple"/>
  <rect x="202" y="54" width="16" height="38" rx="2" class="accent-line"/>
  <rect x="300" y="58" width="80" height="30" class="faint hatch"/>
  <text x="340" y="77.5" text-anchor="middle" class="soft small">a gap</text>
  <rect x="466" y="58" width="8" height="30" class="faint hatch"/>
  <path d="M600 46 V100" class="accent-line"/>
  <text x="600" y="40" text-anchor="middle" class="accent small">the place</text>
  <path d="M596 116 H226" class="accent-line"/>
  <path d="M226 112 L218 116 L226 120 Z" class="accent-line head"/>
  <text x="408" y="132" text-anchor="middle" class="accent small">the lookup walks back through the slot's index entries</text>
  <path d="M100 92 V150" class="thin dash"/>
  <text x="100" y="166" text-anchor="middle" class="soft small">older records:</text>
  <text x="100" y="180" text-anchor="middle" class="soft small">not read</text>
  <path d="M210 92 V150" class="thin dash"/>
  <text x="210" y="166" text-anchor="middle" class="small">next record that</text>
  <text x="210" y="180" text-anchor="middle" class="small">reads: the answer</text>
  <path d="M340 92 V150" class="thin dash"/>
  <text x="340" y="166" text-anchor="middle" class="small">not in the index:</text>
  <text x="340" y="180" text-anchor="middle" class="small">uncovered</text>
  <path d="M470 92 V150" class="thin dash"/>
  <text x="470" y="166" text-anchor="middle" class="small">newest record:</text>
  <text x="470" y="180" text-anchor="middle" class="small">lost, does not read</text>
  <rect x="20" y="206" width="10" height="10" class="tint-purple"/>
  <text x="36" y="215" text-anchor="start" class="soft small">a record of the slot</text>
  <rect x="200" y="206" width="10" height="10" class="faint hatch"/>
  <text x="216" y="215" text-anchor="start" class="soft small">damaged, or not covered by the index</text>
  <text x="20" y="240" text-anchor="start" class="soft small">is_whole is false: the answer names a lost block and an uncovered stretch, where a newer record may hide</text>
</svg>
