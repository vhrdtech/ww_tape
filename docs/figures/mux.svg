<svg class="ww-svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="Four producer threads each hold a handle: a state handle, a records handle, an events handle and a series handle. The events and series handles encode their chunks, hash the payloads and compute the summary leaves on the producer's thread. Every handle sends finished units into one queue bounded by bytes. The writing thread takes the units in the order they came and places them with the piece chain: puts, cuts, summary levels above the leaves, syncs, checkpoints and the close. Its bytes go to the store of the chain. A progress watch tells readers in the same process what was placed" xmlns="http://www.w3.org/2000/svg">
  <!-- producers and their handles -->
  <text x="20" y="20" class="soft small">producer threads, each with its handle</text>
  <rect x="20.5" y="30" width="190" height="44" rx="4" class="tint-blue"/>
  <text x="34" y="49" class="small">the mode</text>
  <text x="34" y="66" class="mono small">StateHandle::put</text>
  <rect x="20.5" y="82" width="190" height="44" rx="4" class="tint-blue"/>
  <text x="34" y="101" class="small">log lines, temperatures</text>
  <text x="34" y="118" class="mono small">RecordsHandle::send</text>
  <rect x="20.5" y="134" width="190" height="44" rx="4" class="tint-blue"/>
  <text x="34" y="153" class="small">CAN frames</text>
  <text x="34" y="170" class="mono small">EventsHandle::push_all</text>
  <rect x="20.5" y="186" width="190" height="44" rx="4" class="tint-blue"/>
  <text x="34" y="205" class="small">phase current</text>
  <text x="34" y="222" class="mono small">SeriesHandle::push</text>
  <text x="20" y="252" class="soft small">a typed handle encodes its chunk,</text>
  <text x="20" y="268" class="soft small">hashes the payload and computes</text>
  <text x="20" y="284" class="soft small">the summary leaves on this thread</text>
  <!-- arrows into the queue -->
  <path d="M212 52 C240 52 240 128 262 128" class="line"/>
  <path d="M212 104 C236 104 240 128 262 128" class="line"/>
  <path d="M212 156 C236 156 240 132 262 132" class="line"/>
  <path d="M212 208 C240 208 240 132 262 132" class="line"/>
  <path d="M268 130 l-8 -4 v8 Z" class="line head"/>
  <!-- the queue -->
  <rect x="270.5" y="92" width="130" height="76" rx="4" class="tint-amber"/>
  <text x="335" y="112" text-anchor="middle" class="strong">the queue</text>
  <text x="335" y="132" text-anchor="middle" class="small">bounded by bytes</text>
  <rect x="284.5" y="142" width="22" height="16" rx="2" class="tint-blue"/>
  <rect x="310.5" y="142" width="40" height="16" rx="2" class="tint-blue"/>
  <rect x="354.5" y="142" width="12" height="16" rx="2" class="tint-blue"/>
  <rect x="370.5" y="142" width="18" height="16" rx="2" class="tint-blue"/>
  <text x="335" y="188" text-anchor="middle" class="soft small">full: wait, fail or drop,</text>
  <text x="335" y="204" text-anchor="middle" class="soft small">by each handle's pressure</text>
  <path d="M402 130 H436" class="line"/>
  <path d="M442 130 l-8 -4 v8 Z" class="line head"/>
  <text x="420" y="120" text-anchor="middle" class="soft small">in order</text>
  <!-- the writing thread -->
  <rect x="444.5" y="30" width="216" height="200" rx="4" class="tint-green"/>
  <text x="552" y="52" text-anchor="middle" class="strong">the writing thread</text>
  <text x="552" y="70" text-anchor="middle" class="mono small">TapeMux</text>
  <text x="458" y="98" class="small">holds the definitions</text>
  <text x="458" y="118" class="small">places each unit</text>
  <text x="458" y="138" class="small">puts definitions and state</text>
  <text x="458" y="158" class="small">builds the summary levels</text>
  <text x="458" y="178" class="small">cuts, syncs, checkpoints</text>
  <text x="458" y="198" class="small">seals a quiet handle's chunk</text>
  <text x="458" y="218" class="small">closes the chain</text>
  <path d="M552 232 V262" class="line"/>
  <path d="M552 268 l-4 -8 h8 Z" class="line head"/>
  <rect x="482.5" y="270" width="140" height="34" rx="4" class="tint-teal"/>
  <text x="552" y="292" text-anchor="middle" class="small">the chain's pieces</text>
  <path d="M442 286 H480" class="line"/>
  <path d="M436 286 l8 -4 v8 Z" class="line head"/>
  <text x="340" y="282" text-anchor="middle" class="small">readers: <tspan class="mono">ProgressWatch</tspan>,</text>
  <text x="340" y="298" text-anchor="middle" class="small mono">ChainFollower</text>
</svg>
