<svg class="ww-svg" viewBox="0 0 680 240" width="680" height="240" role="img" aria-label="The mux's queue is a budget of bytes, 64 MiB by default. A unit takes its bytes when it is sent and gives them back when it is placed. A large chunk takes much of the budget, a put almost none. When the budget is spent, a handle that waits joins a line served in order, a handle that fails gets its unit back, and a handle that drops counts the unit and goes on." xmlns="http://www.w3.org/2000/svg">
  <!-- the budget -->
  <text x="20" y="28" class="strong small">the queue: a budget of bytes, <tspan class="mono">queue_bytes</tspan> (64 MiB by default)</text>
  <rect x="20.5" y="40" width="460" height="36" rx="3" class="hollow"/>
  <rect x="24.5" y="44" width="150" height="28" rx="2" class="tint-blue"/>
  <text x="99" y="62" text-anchor="middle" class="small">chunk of samples</text>
  <rect x="178.5" y="44" width="8" height="28" rx="1" class="tint-green"/>
  <rect x="190.5" y="44" width="150" height="28" rx="2" class="tint-blue"/>
  <text x="265" y="62" text-anchor="middle" class="small">chunk of samples</text>
  <rect x="344.5" y="44" width="40" height="28" rx="2" class="tint-purple"/>
  <rect x="388.5" y="44" width="88" height="28" rx="2" class="tint-blue"/>
  <text x="432" y="62" text-anchor="middle" class="small">chunk</text>
  <text x="182" y="92" text-anchor="middle" class="soft small">a put</text>
  <text x="364" y="92" text-anchor="middle" class="soft small">a block</text>
  <!-- placed: bytes given back -->
  <path d="M482 58 H520" class="line"/>
  <path d="M526 58 l-8 -4 v8 Z" class="line head"/>
  <text x="532" y="54" class="small">placed:</text>
  <text x="532" y="70" class="small">its bytes go back</text>
  <!-- the budget is spent -->
  <text x="20" y="128" class="strong small">the budget is spent: each handle's <tspan class="mono">Pressure</tspan> decides</text>
  <rect x="20.5" y="140" width="200" height="56" rx="3" class="tint-green"/>
  <text x="120" y="160" text-anchor="middle" class="mono small">Wait</text>
  <text x="120" y="178" text-anchor="middle" class="small">joins a line served in order</text>
  <rect x="240.5" y="140" width="200" height="56" rx="3" class="tint-amber"/>
  <text x="340" y="160" text-anchor="middle" class="mono small">Fail</text>
  <text x="340" y="178" text-anchor="middle" class="small">gets its unit back</text>
  <rect x="460.5" y="140" width="200" height="56" rx="3" class="tint-accent"/>
  <text x="560" y="160" text-anchor="middle" class="mono small">Drop</text>
  <text x="560" y="178" text-anchor="middle" class="small">counts the unit and goes on</text>
  <text x="20" y="222" class="soft small">a unit larger than the whole budget goes alone, once the queue is empty</text>
</svg>
