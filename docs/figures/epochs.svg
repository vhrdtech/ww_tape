<svg class="ww-svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="Above, three boots of the board are three clocks, each counting from 0; estimated clock maps place each on the host's time line, with gaps whose length the board cannot know. Below, one long capture at picosecond ticks is cut into three epochs of one counter; exact links put each epoch's tick 0 at a tick of the one before, and the epochs join without a gap" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" text-anchor="start" class="strong">three boots: three clocks, placed by estimated maps</text>
  <line x1="20" y1="56" x2="660" y2="56" class="thin"/>
  <path d="M660 52 L668 56 L660 60 Z" class="thin head"/>
  <text x="20" y="48" text-anchor="start" class="soft small">host clock, ns since the Unix epoch</text>
  <rect x="40.5" y="96" width="170" height="24" rx="2" class="tint-blue"/>
  <text x="125" y="112.5" text-anchor="middle" class="small">boot 1: µs from 0</text>
  <rect x="270.5" y="96" width="140" height="24" rx="2" class="tint-blue"/>
  <text x="340" y="112.5" text-anchor="middle" class="small">boot 2: µs from 0</text>
  <rect x="470.5" y="96" width="170" height="24" rx="2" class="tint-blue"/>
  <text x="555" y="112.5" text-anchor="middle" class="small">boot 3: µs from 0</text>
  <path d="M41 94 V60 M211 94 V60 M271 94 V60 M411 94 V60 M471 94 V60 M641 94 V60" class="thin dash"/>
  <text x="241" y="80" text-anchor="middle" class="soft small">off</text>
  <text x="441" y="80" text-anchor="middle" class="soft small">off</text>
  <text x="20" y="144" text-anchor="start" class="soft small">each boot's clock has its own key (the boot count in it); only an estimated map relates it to the host</text>
  <line x1="20" y1="164" x2="660" y2="164" class="faint"/>
  <text x="20" y="188" text-anchor="start" class="strong">one long capture at ps ticks: three epochs of one counter, linked exactly</text>
  <rect x="20.5" y="210" width="206" height="24" rx="2" class="tint-teal"/>
  <text x="123" y="226.5" text-anchor="middle" class="small">epoch 0</text>
  <rect x="227.5" y="210" width="206" height="24" rx="2" class="tint-teal"/>
  <text x="330" y="226.5" text-anchor="middle" class="small">epoch 1</text>
  <rect x="434.5" y="210" width="206" height="24" rx="2" class="tint-teal"/>
  <text x="537" y="226.5" text-anchor="middle" class="small">epoch 2</text>
  <path d="M227 204 V240 M434 204 V240" class="accent-line"/>
  <text x="227" y="256" text-anchor="middle" class="accent small">epoch 0's tick b₀</text>
  <text x="434" y="256" text-anchor="middle" class="accent small">epoch 1's tick b₀</text>
  <text x="20" y="282" text-anchor="start" class="accent small">each epoch's tick 0 is a tick b₀ of the epoch before: an exact link, slope 1, error 0</text>
</svg>
