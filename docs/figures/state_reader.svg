<svg class="ww-svg" viewBox="0 0 680 316" width="680" height="316" role="img" aria-label="Three readers that start in the middle: one past a damaged start, one with a single piece of a chain, one that joins a live feed late. Each finds the state it needs within near: behind it in the first two cases, and in the bytes it has received once those reach near in the third" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" text-anchor="start" class="strong">a file whose start is damaged</text>
  <rect x="20.5" y="34" width="110" height="26" rx="2" class="faint hatch"/>
  <text x="75" y="51.5" text-anchor="middle" class="soft small">damaged</text>
  <rect x="131.5" y="34" width="528" height="26" rx="2" class="tint-blue"/>
  <rect x="60" y="34" width="6" height="26" class="tint-purple"/>
  <rect x="250" y="34" width="6" height="26" class="tint-purple"/>
  <rect x="480" y="34" width="6" height="26" class="tint-purple"/>
  <path d="M560 30 V66" class="accent-line"/>
  <text x="560" y="80" text-anchor="middle" class="accent small">reader starts</text>
  <path d="M556 26 H448 v4 M556 26 v4" class="thin"/>
  <text x="502" y="20" text-anchor="middle" class="soft small">near</text>
  <text x="440" y="80" text-anchor="end" class="small">a record within near behind: found</text>

  <text x="20" y="122" text-anchor="start" class="strong">one piece of a chain, read alone</text>
  <rect x="20.5" y="134" width="190" height="26" rx="2" class="faint"/>
  <text x="115" y="151.5" text-anchor="middle" class="soft small">piece 1, not at hand</text>
  <rect x="215.5" y="134" width="444" height="26" rx="2" class="tint-blue"/>
  <rect x="215.5" y="134" width="8" height="26" class="tint-ink"/>
  <rect x="226" y="134" width="6" height="26" class="tint-purple"/>
  <rect x="330" y="134" width="6" height="26" class="tint-purple"/>
  <rect x="80" y="134" width="6" height="26" class="tint-purple"/>
  <path d="M400 130 V166" class="accent-line"/>
  <text x="400" y="180" text-anchor="middle" class="accent small">reader starts</text>
  <text x="440" y="151.5" text-anchor="start" class="small">piece 2</text>
  <text x="20" y="180" text-anchor="start" class="small">near counts inside a piece: each piece</text>
  <text x="20" y="194" text-anchor="start" class="small">puts its state again near its start</text>

  <text x="20" y="232" text-anchor="start" class="strong">a live feed joined late</text>
  <rect x="20.5" y="244" width="210" height="26" rx="2" class="faint"/>
  <text x="125" y="261.5" text-anchor="middle" class="soft small">sent before the join</text>
  <rect x="231.5" y="244" width="428" height="26" rx="2" class="tint-blue"/>
  <rect x="120" y="244" width="6" height="26" class="tint-purple"/>
  <rect x="420" y="244" width="6" height="26" class="tint-purple"/>
  <path d="M231 240 V276" class="accent-line"/>
  <text x="231" y="290" text-anchor="middle" class="accent small">reader joins</text>
  <path d="M235 236 H451 v4 M235 236 v4" class="thin"/>
  <text x="343" y="230" text-anchor="middle" class="soft small">near</text>
  <path d="M451 240 V276" class="line dash"/>
  <text x="660" y="290" text-anchor="end" class="small">from here on, every use has its record in what arrived</text>
  <rect x="20" y="300" width="10" height="10" class="tint-purple"/>
  <text x="36" y="309" text-anchor="start" class="soft small">a record of the state: the first, a copy, or a put that wrote it again</text>
</svg>
