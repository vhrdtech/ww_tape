<svg class="ww-svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="The checks of a tape at three levels: a chunk's head CRC covers its header and head, which hold one CRC per segment of the payload; the block CRC covers the whole block; above the blocks, the content hash in the close covers every byte of the piece before the close record" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" text-anchor="start" class="strong">one chunk block</text>
  <text x="660" y="22" text-anchor="end" class="soft small">not to scale</text>
  <path d="M20 46 v-4 H660 v4" class="thin"/>
  <text x="340" y="36" text-anchor="middle" class="small">block CRC: the whole block, a reader trusts nothing else in a bad one</text>
  <rect x="20.5" y="56" width="50" height="34" rx="1" class="tint-green"/>
  <text x="45.5" y="77" text-anchor="middle" class="small">header</text>
  <rect x="71.5" y="56" width="150" height="34" rx="1" class="tint-purple"/>
  <text x="146.5" y="77" text-anchor="middle" class="small">head, segment CRCs</text>
  <rect x="222.5" y="56" width="104" height="34" rx="1" class="tint-blue"/>
  <rect x="327.5" y="56" width="104" height="34" rx="1" class="tint-blue"/>
  <rect x="432.5" y="56" width="104" height="34" rx="1" class="tint-accent"/>
  <rect x="537.5" y="56" width="80" height="34" rx="1" class="tint-blue"/>
  <text x="274.5" y="77" text-anchor="middle" class="small">segment 0</text>
  <text x="379.5" y="77" text-anchor="middle" class="small">segment 1</text>
  <text x="484.5" y="77" text-anchor="middle" class="small">segment 2</text>
  <text x="577.5" y="77" text-anchor="middle" class="small">segment 3</text>
  <rect x="618.5" y="56" width="41" height="34" rx="1" class="tint-green"/>
  <text x="639" y="77" text-anchor="middle" class="small">CRC</text>
  <path d="M20.5 96 v4 H221.5 v-4" class="thin"/>
  <text x="121" y="116" text-anchor="middle" class="small">head CRC: header and head</text>
  <path d="M432.5 96 v4 H536.5 v-4" class="thin"/>
  <text x="484.5" y="116" text-anchor="middle" class="small accent">its segment CRC fails</text>
  <text x="340" y="146" text-anchor="middle" class="soft small">the head holds a CRC per segment of the payload, 64 KiB each as writers make them</text>
  <text x="20" y="190" text-anchor="start" class="strong">one piece</text>
  <rect x="20.5" y="204" width="30" height="30" rx="1" class="tint-green"/>
  <rect x="51.5" y="204" width="420" height="30" rx="1" class="tint-blue"/>
  <text x="261.5" y="223.5" text-anchor="middle" class="small">records blocks, chunks, summaries, checkpoints</text>
  <rect x="472.5" y="204" width="90" height="30" rx="1" class="tint-amber"/>
  <text x="517.5" y="223.5" text-anchor="middle" class="small">final index</text>
  <rect x="563.5" y="204" width="56" height="30" rx="1" class="tint-green"/>
  <text x="591.5" y="223.5" text-anchor="middle" class="small">close</text>
  <rect x="620.5" y="204" width="39" height="30" rx="1" class="tint-green"/>
  <text x="640" y="223.5" text-anchor="middle" class="small">tail</text>
  <path d="M20.5 240 v4 H562.5 v-4" class="thin"/>
  <text x="291.5" y="262" text-anchor="middle" class="small">content hash, BLAKE3: every byte before the close record, stated in the close</text>
  <text x="291.5" y="282" text-anchor="middle" class="soft small">each block still carries its own block CRC</text>
</svg>
