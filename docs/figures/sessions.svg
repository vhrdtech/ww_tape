<svg class="ww-svg" viewBox="0 0 680 226" width="680" height="226" role="img" aria-label="An SD card recorded twice: session B wrote over the start of session A and was cut by a power failure; A's old blocks after the torn one carry another session tag and are stale. The next boot writes session C after B, starting with a piece head that names B" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" text-anchor="start" class="strong">the card after a power failure</text>
  <rect x="20.5" y="50" width="219" height="30" rx="2" class="tint-blue"/>
  <text x="130" y="69.5" text-anchor="middle" class="small">session B</text>
  <rect x="240.5" y="50" width="15" height="30" rx="2" class="tint-accent"/>
  <rect x="256.5" y="50" width="403" height="30" rx="2" class="faint"/>
  <text x="458" y="69.5" text-anchor="middle" class="small">session A's older blocks: stale</text>
  <path d="M257 88 v4 H380 v-4" class="thin"/>
  <text x="318" y="107" text-anchor="middle" class="soft small">probed for B's next block</text>
  <text x="318" y="121" text-anchor="middle" class="soft small">within gap_max: none</text>
  <text x="248" y="44" text-anchor="middle" class="accent small">torn</text>
  <text x="20" y="158" text-anchor="start" class="strong">after the next boot</text>
  <rect x="20.5" y="170" width="219" height="30" rx="2" class="tint-blue"/>
  <text x="130" y="189.5" text-anchor="middle" class="small">session B</text>
  <rect x="240.5" y="170" width="15" height="30" rx="2" class="tint-accent"/>
  <rect x="256.5" y="170" width="13" height="30" rx="2" class="tint-ink"/>
  <rect x="270.5" y="170" width="179" height="30" rx="2" class="tint-green"/>
  <text x="360" y="189.5" text-anchor="middle" class="small">session C</text>
  <rect x="450.5" y="170" width="209" height="30" rx="2" class="faint"/>
  <text x="555" y="189.5" text-anchor="middle" class="small">A: still stale</text>
  <path d="M263 168 Q250 140 238 166" class="accent-line"/>
  <path d="M238.0 166.0 L237.8 158.2 L244.1 161.1 Z" class="accent-line head"/>
  <text x="262" y="214" text-anchor="start" class="soft small">piece head naming B as the previous session</text>
  <line x1="263" y1="201" x2="263" y2="204" class="thin"/>
</svg>
