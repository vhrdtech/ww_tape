<svg class="ww-svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-label="How the band spreads over threads. The receiver splits the band into channels of equal rate. Each channel is a series track iq with a producer thread of its own, whose grid handle packs the samples at 12 bits, hashes them and computes the summary leaves on that thread. Channel k sends its chunks to mux k mod m; each mux places them on its one writing thread into a chain of its own, in memory or on a disk of its own" xmlns="http://www.w3.org/2000/svg">
