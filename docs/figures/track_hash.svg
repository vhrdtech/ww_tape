  <circle cx="233" cy="250" r="4" class="blue"/>
  <circle cx="401" cy="250" r="4" class="blue"/>
  <circle cx="477" cy="250" r="4" class="blue"/>
  <text x="516" y="254.5" text-anchor="start" class="accent small">from the index entries alone</text>
</svg>
