<svg class="ww-svg" viewBox="0 0 680 236" width="680" height="236" role="img" aria-label="Three tracks of one receive queue. The frames track holds each frame as an event: its arrival tick and its bytes as the payload, numbered 0 to 6. The ipv4 track holds 12 bytes of decoded IPv4 header per frame and the l4 track 8 bytes of TCP or UDP header. Each decoded item keeps its frame's item number in the relation frame, which only grows. Frame 4 carries no IPv4, so the two decoded tracks skip its number" xmlns="http://www.w3.org/2000/svg">
