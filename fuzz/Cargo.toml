[package]
name = "ww_tape_fuzz_targets"
version = "0.0.0"
edition = "2024"
description = "cargo-fuzz targets of ww_tape's decoders, writers and readers"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Built by cargo-fuzz on a nightly toolchain with its own flags: not a member of the root workspace.
# The target bodies live in ww_tape_fuzz, where seed replay runs them in `just test`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ww_tape_fuzz = { path = "../ww_tape_fuzz" }

[[bin]]
name = "tape-reader"
path = "src/tape_reader.rs"
test = false
doc = false
bench = false

