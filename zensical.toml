# The ww_tape book: the pages in docs/, built with Zensical (`just book`, `just book-serve`, `just book-check`).
# It stands on its own: the WireWeaver and logring books are separate sites, linked by their URLs.
[project]
site_url = "https://tape.vhrd.tech/"
site_name = "ww_tape"
site_description = "Tapes: tracks of typed records over time, for live feeds, log files and raw media"
site_author = "Roman Isaikin"

copyright = "Copyright &copy; 2026 vhrdtech"

repo_url = "https://github.com/vhrdtech/ww_tape"
repo_name = "vhrdtech/ww_tape"
edit_uri = "edit/main/docs/"

nav = [
    { "Introduction" = [
            "index.md",
            "records_and_clocks.md",
            "blocks.md",
            "anatomy.md",
            "related_books.md"
        ]
    },
    { "Using tapes" = [
            "concepts.md",
            "sessions_and_pieces.md",
            "writing.md",
            "sinks_and_locks.md",
            "syncing_and_cuts.md",
            "resuming.md",
            "pieces_and_files.md",
            "track_hashes.md",
            "reading.md",
            "growing_pieces.md",
            "events_and_series.md",
            "series.md",
            "summaries.md",
            "numbers.md",
            "recovery.md",
            "damaged_files.md",
            "raw_media.md"
        ]
    },
    { "Reference" = [
            "format.md",
            "glossary.md",
            { "Features and roadmap" = "https://github.com/vhrdtech/ww_tape/blob/main/FEATURES.md" },
            { "Changelog" = "https://github.com/vhrdtech/ww_tape/blob/main/CHANGELOG.md" }
        ]
    }
]

# figures.css: the classes of the SVG figures the pages inline from docs/figures and docs/plots, light and dark;
# hero.css: the logo at the top of index.md; spl-refs.css and spl-refs.js: the cards of glossary terms and code links,
# written by `spl book refs` (`just book-refs`)
extra_css = ["stylesheets/vhrd.css", "stylesheets/figures.css", "stylesheets/hero.css", "stylesheets/spl-refs.css"]
extra_javascript = ["javascripts/spl-refs.js"]

[project.theme]
favicon = "assets/ww_tape_icon.svg"
logo = "assets/ww_tape_icon.svg"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vhrdtech/ww_tape"
name = "ww_tape on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://vhrd.tech"
name = "vhrd.tech website"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Inlines the SVG figures and the logo (`--8<-- "docs/figures/chain.svg"`), paths from the repository root
pymdownx.snippets = {
  base_path = ["."],
  check_paths = true
}
pymdownx.superfences = {}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
# `[[term]]`: a glossary term from docs/glossary.toml, its entry on hover; glossary.md lists every entry
"spl_book_ext.glossary" = {}
# [`Name`], [`file.rs`], [`file.rs:section`]: an item or file of these crates, its code on hover, its lines on GitHub
# on click; a name that matches nothing fails the build
"spl_book_ext.code_refs" = { crates = ["ww_tape", "ww_tape_codecs", "ww_tape_summary", "ww_tape_fs"] }
