# The ww_tape book: the pages in docs/, built with Zensical (`just book`, `just book-serve`, `just book-check`).
# It stands on its own: the WireWeaver and logring books are separate sites, linked by their URLs.
[project]
site_url = "https://tape.vhrd.tech/"
site_name = "ww_tape"
site_description = "Tapes: tracks of typed records over time, for live feeds, log files and raw media"
site_author = "Roman Isaikin"

copyright = "Copyright &copy; 2026 vhrdtech"

repo_url = "https://github.com/vhrdtech/ww_tape"
repo_name = "vhrdtech/ww_tape"
edit_uri = "edit/main/docs/"

# The reading ramp: Introduction, Basic, Advanced and Nomicon, each part one reading level, so next never steps down
# (docs/levels.md); then the Reference and Articles shelves, whose pages keep their own level. `vz check`
# (book_checks.toml) fails a nav that steps down, a page without a level and a page listed twice.
nav = [
    { "Introduction" = [
            "index.md",
            "levels.md",
            "tape.md",
            "first_tape.md"
        ]
    },
    { "Basic" = [
            "basic/index.md",
            { "How a tape is built" = [
                    "tracks.md",
                    "items.md",
                    "blocks.md",
                    "definitions.md",
                    "state.md",
                    "anatomy.md"
                ]
            },
            { "Writing" = [
                    "writing.md",
                    "writer_adds.md",
                    "aligned.md",
                    "writing_thread.md",
                    "mux_queue.md",
                    "files.md",
                    "pieces.md",
                    "old_pieces.md",
                    "crashes.md",
                    "resume_cases.md"
                ]
            },
            { "Reading" = [
                    "reading.md",
                    "events.md",
                    "series.md",
                    "summaries.md"
                ]
            },
            { "Damage" = [
                    "damage.md",
                    "reading_past_damage.md",
                    "damaged_pieces.md",
                    "integrity.md"
                ]
            }
        ]
    },
    { "Advanced" = [
            "advanced/index.md",
            { "Time" = [
                    "clocks.md"
                ]
            },
            { "Writing in depth" = [
                    "own_chunks.md",
                    "columns.md",
                    "sample_codecs.md",
                    "live_feeds.md"
                ]
            },
            { "Reading in depth" = [
                    "growing_pieces.md",
                    "grids.md"
                ]
            },
            { "Copies and media" = [
                    "copies.md",
                    "check_pieces.md",
                    "raw_media.md",
                    "raw_gaps.md"
                ]
            }
        ]
    },
    { "Nomicon" = [
            "nomicon/index.md",
            "carried_definitions.md",
            "carried_room.md",
            "track_hashes.md",
            "lessons.md"
        ]
    },
    { "Reference" = [
            "reference/index.md",
            "glossary.md",
            "sizes.md",
            "format.md",
            "related_books.md",
            "writers.md",
            { "Features and roadmap" = "https://github.com/vhrdtech/ww_tape/blob/main/FEATURES.md" },
            { "Changelog" = "https://github.com/vhrdtech/ww_tape/blob/main/CHANGELOG.md" }
        ]
    },
    { "Articles" = [
            "protocol_analyser.md",
            "wideband.md"
        ]
    }
]

# figures.css: the classes of the SVG figures the pages inline from docs/figures and docs/plots, light and dark;
# shots.css: shows the light or the dark screenshot of a pair per scheme;
# hero.css: the logo at the top of index.md; vz-refs.css and vz-refs.js: the cards of glossary terms and code links;
# vz-code.css: the code colours; vz-review.css and vz-review.js: the read badge and review marks; all written by
# `vz prep` (`just book-refs`)
extra_css = ["stylesheets/vhrd.css", "stylesheets/figures.css", "stylesheets/tables.css", "stylesheets/code.css", "stylesheets/shots.css", "stylesheets/hero.css", "stylesheets/vz-refs.css", "stylesheets/vz-code.css", "stylesheets/vz-review.css"]
# javascripts/vz-stamp-age.js is written by `just book-refs` (`vz prep`), not in git
extra_javascript = ["javascripts/vz-refs.js", "javascripts/vz-stamp-age.js", "javascripts/vz-review.js"]

[project.theme]
# overrides/main.html: the reading level badge above a page's title, from its `level:` front matter (docs/levels.md);
# overrides/partials/copyright.html: the build stamp in the footer;
# overrides/partials/header.html: the header with the book name linking to the home page
custom_dir = "overrides"
favicon = "assets/ww_tape_icon.svg"
logo = "assets/ww_tape_icon.svg"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vhrdtech/ww_tape"
name = "ww_tape on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://vhrd.tech"
name = "vhrd.tech website"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
  extend_pygments_lang = [
    { name = "console", lang = "vz-console" },
    { name = "rust", lang = "vz-rust" },
  ],
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Inlines the SVG figures and the logo (`--8<-- "docs/figures/chain.svg"`), paths from the repository root
pymdownx.snippets = {
  dedent_subsections = true,
  base_path = ["."],
  check_paths = true
}
pymdownx.superfences = {}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
# `[[term]]`: a glossary term from docs/glossary.toml, its entry on hover; glossary.md lists every entry
"vhrd_zensical.glossary" = {}
# CAN, SD and every abbreviation of docs/abbreviations.toml: its long form on hover, through `abbr` above
"vhrd_zensical.abbreviations" = {}
# A "Read 82%" badge above "On this page" and review marks beside each block (badge or `r`), from
# target/vz/review.json (`glossator book export`, `just book-refs`); without the file, nothing
"vhrd_zensical.review" = {}
# [`Name`], [`file.rs`], [`file.rs:section`]: an item or file of these crates, the format's and the running example's:
# its code on hover, its lines on GitHub on click; a name that matches nothing fails the build
"vhrd_zensical.code_refs" = { crates = ["ww_tape", "ww_tape_codecs", "ww_tape_summary", "ww_tape_fs", "ww_tape_mux", "example_capture", "example_drive", "example_ethernet", "example_rf", "example_wideband"] }
