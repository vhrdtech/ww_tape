name: CI

# The checks of `just lint` (spl check among them), `just test`, `just check` and `just book-check`, one job each.

on:
  merge_group:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  cargo-sort:
    name: cargo sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      # --grouped keeps the blank line separated groups in [workspace.dependencies]
      - run: cargo sort --workspace --grouped --check

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo doc --workspace --no-deps --all-features

  spl:
    name: spl check, every lint of spirit_level.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      # spl, spirit_level's CLI, at 0.7.6 (the book extension `spl` in the justfile is the same release)
      # spl 0.7.6 has a warning of its own (unused workspace dependency anstyle); allow it for this install only
      - run: cargo install --locked --git https://github.com/romixlab/spirit_level --rev 9b64ec90e83c7e7421bc76d47c1cab470c572d61 spirit_level_cli
        env:
          CARGO_BUILD_WARNINGS: allow
      - run: spl tools needed --spec --missing | xargs -r cargo binstall -y
      - run: spl check --progress never

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # the seed replay and hostile streams of every fuzz target run here
      - run: cargo nextest run --workspace --all-targets --profile ci
      # nextest does not run doctests
      - run: cargo test --workspace --doc

  wasm:
    name: positional reader on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
      - run: cargo check -p ww_tape --no-default-features --features=alloc --target wasm32-unknown-unknown
      - run: RUSTFLAGS="-D warnings" cargo check -p ww_tape --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p ww_tape_codecs --no-default-features --target wasm32-unknown-unknown

  arm:
    name: test and clippy on aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # the ARMv8 CRC extension kernel (ww_tape_codecs/src/crc32c/hw_aarch64.rs) only runs here
      - run: cargo nextest run --workspace --all-targets --profile ci
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fuzz:
    name: fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly-2026-11-19
          cache-workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,just
      - run: just fuzz-smoke

  book:
    name: the book builds without warnings and passes the prose lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # spl, spirit_level's CLI, at 0.7.6 (the book extension `spl` in the justfile is the same release)
      # spl 0.7.6 has a warning of its own (unused workspace dependency anstyle); allow it for this install only
      - run: cargo install --locked --git https://github.com/romixlab/spirit_level --rev 9b64ec90e83c7e7421bc76d47c1cab470c572d61 spirit_level_cli
        env:
          CARGO_BUILD_WARNINGS: allow
      - run: just book-check
